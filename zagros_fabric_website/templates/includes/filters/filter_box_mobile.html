<section class="w-full mt-10 lg:hidden relative">
  <div class="text-2xl text-gray-400 font-bold mb-5 px-20 flex cursor-pointer hover:text-cyan-900 w-fit" id="filter_bars">
    <i class="fa-solid fa-filter ml-2"></i>
    <p>فیلتر</p>
  </div>
  <section class="opacity-0 pointer-events-none bg-amber-800 header_box" id="filter_bars_os">
    <section class="scale-95 opacity-70 transition_01" id="filter_bars_box">
      <form method="GET" class="text-xl text-amber-50" id="">
       <div class="flex items-center justify-between">
         <div class="flex flex-wrap">
          <button type="submit" class="px-5 py-2 border-2 rounded-2xl text-base text-green-500 cursor-pointer mt-2 mr-2">
          <i class="fa-solid fa-check"></i>
          اعمال فیلترها
        </button>

        <a href="{% url 'product_list_page' %}" class="px-5 py-2 border-2 rounded-2xl text-base text-red-500 cursor-pointer mt-2 mr-2">
          <i class="fa-solid fa-xmark"></i>
          حذف فیلترها
        </a>
         </div>

        <div class="flex justify-end items-start mt-0.5">
        <i class="fa-solid fa-xmark text-2xl transition_01" id="filter_bars_close"></i>
      </div>
       </div>
        {% with size_type='_mobile' %}
          {% for all_items, selected_items, verbose, filter_item in filter_attributes %}
            {% include 'includes/filters/attribute.html' %}
          {% endfor %}
        {% endwith %}
        <div class="flex flex-wrap justify-center gap-5"></div>
      </form>
    </section>
  </section>
</section>
