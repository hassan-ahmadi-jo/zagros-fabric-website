{% extends 'base.html' %}
{% load static %}
{% block content %}
  <header class="flex mt-10 p-1 justify-between items-center flex-wrap sm:px-5 lg:pl-12 lg:pr-40 md:py-12">
    <section class="mt-10 flex items-center flex-col w-full justify-center sm:items-start sm:w-[65%] lg:w-[60%] xl:w-1/2">
      <h1 class="text-4xl font-black mr-1 text-cyan-200 sm:text-5xl md:text-6xl">پارچه سرای زاگرس</h1>
      <h2 class="text-base mt-9 lg:text-xl">با ما، بهترین انتخاب را داشته باشید</h2>
      <a href="{% url 'product_list_page' %}" class="mt-12 float mx-auto btn">مشاهده پارچه‌ها</a>
    </section>
    <img src="{% static 'images/first_page_image.png' %}" alt="پارچه‌های رنگی" class="w-[30%] aspect-square rounded-2xl shadow-md border-2 border-gray-800 hidden lg:block" />
  </header>
  <section class="w-[80%] border-b-2 border-gray-700 mx-auto my-5"></section>

  <main class="mb-20">
    <section class="grid grid-cols-1 items-center justify-center gap-x-2 gap-y-4 mt-20 max-w-187 mx-auto sm:grid-cols-2">
      {% for usage in usage_dict %}
        {% if forloop.counter < 5 %}
          <a href="{% url 'product_list_page' %}?usage={{ usage }}" class="flex justify-center items-center flex-col mb-2 border-gray-700 hover:border-b-2 hover:mb-1.5 hover:scale-[1.02] transition-transform duration-200">
            <img src="{% static 'images/test.jpeg' %}" alt="نوع پارچه" class="aspect-[66%] w-85 object-cover rounded-md sm:w-90" />
            <p class="text-2xl mt-5 mb-2 font-semibold">{{ usage }}</p>
          </a>
        {% endif %}
      {% endfor %}
    </section>
    <section class="mt-13 text-center">
      <a href="{% url 'categories_page' %}" class="btn">مشاهده همه دسته‌ بندی‌ها</a>
    </section>
  </main>
{% endblock %}
